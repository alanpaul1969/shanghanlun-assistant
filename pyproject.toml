[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shanghanlun-assistant"
version = "0.6.2"
description = "傷寒論臨床決策輔助 WebUI — 八綱/六經/方證推論、七典RAG、LLM追問/選方/加減分析"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["flask>=3.0", "pillow>=10.0"]

[project.optional-dependencies]
rag = ["numpy>=1.26", "opencc-python-reimplemented>=0.1.7"]

[project.scripts]
shanghanlun = "webui.app:main"

[tool.setuptools]
packages = ["webui"]
include-package-data = true

[tool.setuptools.package-data]
webui = ["templates/*.html", "static/**/*.png", "static/css/*.css", "*.json"]
